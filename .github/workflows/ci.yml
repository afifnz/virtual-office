name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # verify/e2e_review.sh expects the sandbox layout: binary under
      # /workspace/.gotmp/bin and the demo fixture at /tmp/hh.
      - name: Build binary
        run: |
          sudo mkdir -p /workspace/.gotmp/bin
          sudo chown -R "$USER" /workspace
          cd backend && go build -o /workspace/.gotmp/bin/office-api ./cmd/office-api
      - name: Fixture
        run: python3 deploy/make-fixture.py /tmp/hh
      - name: e2e_review.sh
        run: bash verify/e2e_review.sh
