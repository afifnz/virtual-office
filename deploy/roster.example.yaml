# Contoh roster override — salin, ubah, lalu tunjuk lewat OFFICE_ROSTER.
#
#   OFFICE_ROSTER=./deploy/roster.example.yaml ./office-api
#
# Semua field opsional. Profil yang tidak disebut tetap muncul di kantor dengan
# nama/peran bawaan (lihat DefaultAgents), atau nama = id dan peran "Agen" untuk
# profil yang tidak dikenal. Format JSON dengan bentuk yang sama juga diterima
# (.json), dan isi /api/config bisa langsung dipakai ulang sebagai file roster
# karena kunci "roster" diterima selain "agents".
#
# Daftar boleh di kolom 0 (`- id: dev`) atau diindentasi; `agents: []` berarti
# daftar kosong. Id wajib ^[a-zA-Z0-9_-]+$.
#
# Tim = id ruangan yang digambar frontend: lobby, dev, edu. `pendopo` masih
# diterima sebagai alias `lobby`.
#
# tz di sini menang atas OFFICE_TZ dan dipakai loader untuk batas hari.
title: Agent Office
tz: Asia/Jakarta

teams:
  - id: lobby
    label: Pendopo
  - id: dev
    label: Ruang Tim Dev
  - id: edu
    label: Ruang Tim Edu

agents:
  - id: default
    name: Ndoro Kakung
    role: Asisten Pribadi
    team: lobby
  - id: dev
    name: Bima
    role: Lead Dev
    team: dev
  - id: planner
    name: Raka
    role: Perencana
    team: dev
  - id: coder
    name: Dimas
    role: Programmer
    team: dev
  - id: reviewer
    name: Yoga
    role: Reviewer
    team: dev
  - id: tester
    name: Sari
    role: Tester
    team: dev
  - id: edu
    name: Ayu
    role: Lead Edu
    team: edu
  - id: edu-designer
    name: Nisa
    role: Desainer Materi
    team: edu
  - id: edu-writer
    name: Yohan
    role: Penulis Materi
    team: edu
  - id: edu-reviewer
    name: Hadi
    role: Reviewer Materi
    team: edu
