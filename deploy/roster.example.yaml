# Contoh roster override — salin, ubah, lalu tunjuk lewat OFFICE_ROSTER.
#
#   OFFICE_ROSTER=./deploy/roster.example.yaml ./office-api
#
# Semua field opsional. Profil yang tidak disebut tetap muncul di kantor dengan
# nama = id profil dan peran generik ("Agen"). Format JSON dengan bentuk yang
# sama juga diterima (.json), dan isi /api/config bisa langsung dipakai ulang
# sebagai file roster karena kunci "roster" diterima selain "agents".
