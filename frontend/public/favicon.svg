<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Agent Office">
  <!--
    Agent Office mark — three stacked floors with glass window bands, drawn from
    plain rects on a 32 px grid.

    Palette: the office page (#0F1B2E) as a solid plate (never a transparent
    icon: a browser tab can be light or dark), the glass front (#E8F1FA) for the
    floor slabs, the brand amber (#F0B45A) for the window light and the plinth,
    and the page colour again for the lobby door.

    Small-size rules: floors are 4.4 units tall with 2.8-unit gaps (2.2 px and
    1.4 px at 16×16), so the three slabs stay separate when the icon is
    downscaled; nothing is thinner than 1.8 units (0.9 px at 16×16). The amber
    plinth is 2.4 units (1.2 px) — the one strong mark that survives 16×16.
  -->
  <rect width="32" height="32" rx="6" fill="#0F1B2E"/>
  <rect x="1" y="1" width="30" height="30" rx="5.2" fill="none" stroke="#F0B45A" stroke-width="1.1"/>

  <!-- three stacked floors: light glass front, 4.4 units tall, 2.8 unit gaps -->
  <rect x="7" y="6.6" width="18" height="4.4" fill="#E8F1FA"/>
  <rect x="7" y="13.8" width="18" height="4.4" fill="#E8F1FA"/>
  <rect x="6" y="21.0" width="20" height="4.4" fill="#E8F1FA"/>

  <!-- glazing: three amber window bands per floor, aligned top to bottom -->
  <rect x="8.2" y="7.7" width="4.2" height="2.2" fill="#F0B45A"/>
  <rect x="14" y="7.7" width="4.2" height="2.2" fill="#F0B45A"/>
  <rect x="19.8" y="7.7" width="4.2" height="2.2" fill="#F0B45A"/>

  <rect x="8.2" y="14.9" width="4.2" height="2.2" fill="#F0B45A"/>
  <rect x="14" y="14.9" width="4.2" height="2.2" fill="#F0B45A"/>
  <rect x="19.8" y="14.9" width="4.2" height="2.2" fill="#F0B45A"/>

  <rect x="8.2" y="22.1" width="4.2" height="2.2" fill="#F0B45A"/>
  <rect x="19.6" y="22.1" width="4.2" height="2.2" fill="#F0B45A"/>

  <!-- lobby door: the page colour punched through the bottom floor -->
  <rect x="14.4" y="22.1" width="3.2" height="3.3" fill="#0F1B2E"/>

  <!-- plinth: the one solid amber base, still visible at 16 px -->
  <rect x="3.5" y="26.9" width="25" height="2.4" fill="#F0B45A"/>
</svg>
